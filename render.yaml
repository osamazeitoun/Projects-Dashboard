# Render Blueprint — a full-app preview environment that mirrors Replit.
#
# One web service builds and serves BOTH the Express API and the Vite SPA on a
# single origin (SERVE_CLIENT=1), backed by a managed Postgres. Every push to
# the configured branch auto-deploys, giving you a shareable URL to review the
# running app *before* you pull it into Replit.
#
# Setup (one time):
#   1. Push this branch to GitHub.
#   2. In Render: New > Blueprint, point it at this repo, pick the branch.
#   3. Fill the secret env vars marked `sync: false` (see PREVIEW.md).
#   4. Deploy. Subsequent pushes redeploy automatically.
#
# See PREVIEW.md for the Clerk-key vs dev-auth (no-account) options.

databases:
  - name: milestones-preview-db
    plan: free
    databaseName: milestones
    user: milestones

services:
  - type: web
    name: milestones-preview
    runtime: node
    plan: free
    region: oregon
    # Track the branch you want to preview. Change as needed.
    branch: claude/modest-einstein-mkLA3
    autoDeploy: true
    healthCheckPath: /api/healthz
    buildCommand: |
      corepack enable
      corepack prepare pnpm@10.33.0 --activate
      pnpm install --frozen-lockfile
      pnpm --filter @workspace/milestones run build
      pnpm --filter @workspace/api-server run build
      pnpm --filter @workspace/db run push
      pnpm --filter @workspace/scripts run seed
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      # Serve the built SPA from the API origin (single-service preview).
      - key: SERVE_CLIENT
        value: "1"
      - key: CLIENT_DIST
        value: artifacts/milestones/dist/public
      - key: DATABASE_URL
        fromDatabase:
          name: milestones-preview-db
          property: connectionString
      # --- Auth: real Clerk (a free dev instance is fine). Set in dashboard. ---
      # Both the server (CLERK_SECRET_KEY/CLERK_PUBLISHABLE_KEY) and the build
      # (VITE_CLERK_PUBLISHABLE_KEY, inlined by Vite) need the keys.
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      # The first user to sign in with this email becomes a company admin.
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      # Procore stays in demo mode for the preview (no real OAuth needed).
      - key: PROCORE_DEMO_MODE
        value: "1"
      # --- Alternative: skip Clerk entirely (no account). See PREVIEW.md. ---
      # To use the dev-auth bypass instead of Clerk, in the dashboard set:
      #   NODE_ENV=development, DEV_AUTH_ENABLED=1, VITE_DEV_AUTH=1
      # and leave the Clerk keys blank. (The bypass is disabled when
      # NODE_ENV=production, by design.)
