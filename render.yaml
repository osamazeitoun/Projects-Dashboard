# Render Blueprint — a full-app preview environment that mirrors Replit.
#
# One web service builds and serves BOTH the Express API and the Vite SPA on a
# single origin (SERVE_CLIENT=1), backed by a managed Postgres. Every push to
# the configured branch auto-deploys, giving you a shareable URL to review the
# running app *before* you pull it into Replit.
#
# This Blueprint is preconfigured for ZERO-SETUP dev-auth mode: no Clerk
# account, no keys, no manual env vars. The preview drops you straight into the
# app as a dev admin. To use real Clerk auth instead, see PREVIEW.md.
#
# Setup:
#   1. In Render: New > Blueprint, point it at this repo, pick the branch.
#   2. Apply. No env vars to fill in.
#   3. Subsequent pushes redeploy automatically.

databases:
  - name: milestones-preview-db
    plan: free
    databaseName: milestones
    user: milestones

services:
  - type: web
    name: milestones-preview
    runtime: node
    plan: free
    region: oregon
    # Track the branch you want to preview. Change as needed.
    branch: claude/modest-einstein-mkLA3
    autoDeploy: true
    healthCheckPath: /api/healthz
    # `push-force` and a non-fatal seed keep the deploy from failing on a fresh
    # DB; the app still comes up even if the demo seed has a hiccup.
    buildCommand: |
      corepack enable
      corepack prepare pnpm@10.33.0 --activate
      pnpm install --frozen-lockfile
      pnpm --filter @workspace/milestones run build
      pnpm --filter @workspace/api-server run build
      pnpm --filter @workspace/db run push-force
      pnpm --filter @workspace/scripts run seed || echo "seed skipped (continuing)"
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      # Dev-auth preview: NODE_ENV=development is REQUIRED for the dev bypass
      # (it is force-disabled under production, by design).
      - key: NODE_ENV
        value: development
      - key: DEV_AUTH_ENABLED
        value: "1"
      # Inlined into the SPA build by Vite — bypasses Clerk sign-in entirely.
      - key: VITE_DEV_AUTH
        value: "1"
      # Serve the built SPA from the API origin (single-service preview).
      - key: SERVE_CLIENT
        value: "1"
      - key: CLIENT_DIST
        value: artifacts/milestones/dist/public
      - key: DATABASE_URL
        fromDatabase:
          name: milestones-preview-db
          property: connectionString
      # Procore stays in demo mode for the preview (no real OAuth needed).
      - key: PROCORE_DEMO_MODE
        value: "1"
      # --- To switch to real Clerk auth instead (see PREVIEW.md): set
      #     NODE_ENV=production and remove DEV_AUTH_ENABLED / VITE_DEV_AUTH,
      #     then add CLERK_SECRET_KEY, CLERK_PUBLISHABLE_KEY,
      #     VITE_CLERK_PUBLISHABLE_KEY, and INITIAL_ADMIN_EMAIL.
