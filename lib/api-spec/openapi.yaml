openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: milestones
    description: Milestone operations
  - name: impacts
    description: Impact response operations
  - name: projects
    description: Project metadata
  - name: me
    description: Current user
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Current user, their companies, and active project
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/active-workspace:
    post:
      operationId: setActiveWorkspace
      tags: [me]
      summary: Set the signed-in user's active (company, project) workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveWorkspaceInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Invalid workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/summary:
    get:
      operationId: getMyProjectSummary
      tags: [projects]
      summary: Project summary for the signed-in user's active project
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No accessible project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/milestones/upcoming:
    get:
      operationId: getMyUpcomingMilestones
      tags: [milestones]
      summary: Upcoming milestones for the signed-in user's company on the active project
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingMilestone"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/impacts/pending:
    get:
      operationId: getMyPendingImpacts
      tags: [impacts]
      summary: Pending impacts for the signed-in user's company on the active project
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingImpact"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectListItem" }

  /projects/{projectId}/pm-summary:
    get:
      operationId: getPmProjectSummary
      tags: [projects]
      summary: PM project dashboard summary
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PmProjectSummary" }

  /projects/{projectId}/milestones:
    get:
      operationId: getProjectMilestones
      tags: [milestones]
      summary: Master schedule – all milestones for a project
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PmMilestone" }

  /milestones/{milestoneId}/detail:
    get:
      operationId: getMilestoneDetail
      tags: [milestones]
      summary: Full milestone detail (PM view) with change history and responses
      parameters:
        - in: path
          name: milestoneId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MilestoneDetail" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /projects/{projectId}/companies:
    get:
      operationId: getProjectCompanies
      tags: [projects]
      summary: Companies participating in a project, with responsiveness rollups
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectCompanyDetail" }

  /projects/{projectId}/change-events:
    get:
      operationId: getProjectChangeEvents
      tags: [impacts]
      summary: Chronological list of all change events on a project
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChangeEventSummary" }

  /change-events/{changeEventId}/detail:
    get:
      operationId: getChangeEventDetail
      tags: [impacts]
      summary: Drill-in detail for a change event including all per-company responses
      parameters:
        - in: path
          name: changeEventId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeEventDetail" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /impacts/{impactId}/respond:
    post:
      operationId: respondToImpact
      tags: [impacts]
      summary: Submit a response to an impact notification
      parameters:
        - in: path
          name: impactId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpactResponseInput"
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneImpact"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]

    StageCode:
      type: string
      enum:
        - ST1_PRE_DESIGN_CONCEPT
        - ST2_DESIGN_DEVELOPMENT
        - ST3_AUTHORITY_APPROVALS
        - ST4_DETAILED_DESIGN_TENDER
        - ST5_CONSTRUCTION_SHELL_CORE
        - ST6_CONSTRUCTION_MEP_BLOCKWORK
        - ST7_INTERIOR_FITOUT
        - ST8_EXTERNAL_WORKS_FINAL_MEP
        - ST9_COMPLETION_SNAGGING_HANDOVER
        - ST10_CLIENT_HANDOVER_DLP

    MilestoneStatus:
      type: string
      enum: [Planned, OnTrack, AtRisk, Delayed, Completed]

    ImpactRiskLevel:
      type: string
      enum: [None, Low, Medium, High]

    ImpactRiskType:
      type: string
      enum: [Time, Cost, Quality, Scope, Resources, Authority, Other]

    ImpactResponseStatus:
      type: string
      enum: [Pending, Submitted, Reviewed, Closed]

    ChangeEventStatus:
      type: string
      enum:
        - Draft
        - SentForClientReview
        - ClientApproved
        - ClientRejected
        - PMApproved
        - Cancelled

    StageInfo:
      type: object
      required: [stageCode, name, order, milestoneCount, keyOutputCount, companyMilestoneCount]
      properties:
        stageCode: { $ref: "#/components/schemas/StageCode" }
        name: { type: string }
        order: { type: integer }
        milestoneCount: { type: integer }
        keyOutputCount: { type: integer }
        companyMilestoneCount: { type: integer }

    ProjectSummary:
      type: object
      required: [projectId, projectName, projectCode, stages, upcomingMilestoneCount, pendingImpactCount]
      properties:
        projectId: { type: integer }
        projectName: { type: string }
        projectCode: { type: string }
        stages:
          type: array
          items: { $ref: "#/components/schemas/StageInfo" }
        upcomingMilestoneCount: { type: integer }
        pendingImpactCount: { type: integer }

    UpcomingMilestone:
      type: object
      required:
        - id
        - code
        - name
        - stageCode
        - stageName
        - currentDate
        - status
        - isKeyOutput
        - criticalFlag
        - ownerRole
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        stageCode: { $ref: "#/components/schemas/StageCode" }
        stageName: { type: string }
        currentDate: { type: string, format: date-time }
        baselineDate: { type: string, format: date-time }
        previousDate: { type: ["string", "null"], format: date-time }
        status: { $ref: "#/components/schemas/MilestoneStatus" }
        isKeyOutput: { type: boolean }
        criticalFlag: { type: boolean }
        ownerRole: { type: string }

    PendingImpact:
      type: object
      required:
        - id
        - milestoneId
        - milestoneName
        - milestoneCode
        - stageCode
        - stageName
        - oldDate
        - newDate
        - changeReason
        - changeEventStatus
        - notifiedAt
        - responseStatus
      properties:
        id: { type: integer }
        milestoneId: { type: integer }
        milestoneName: { type: string }
        milestoneCode: { type: string }
        stageCode: { $ref: "#/components/schemas/StageCode" }
        stageName: { type: string }
        oldDate: { type: string, format: date-time }
        newDate: { type: string, format: date-time }
        changeReason: { type: string }
        changeEventStatus: { $ref: "#/components/schemas/ChangeEventStatus" }
        notifiedAt: { type: string, format: date-time }
        responseStatus: { $ref: "#/components/schemas/ImpactResponseStatus" }
        isKeyOutput: { type: boolean }

    ProjectListItem:
      type: object
      required: [id, name, code, companyCount, milestoneCount]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        companyCount: { type: integer }
        milestoneCount: { type: integer }

    StageBreakdown:
      type: object
      required: [stageCode, name, order, milestoneCount, atRiskCount, completedCount]
      properties:
        stageCode: { $ref: "#/components/schemas/StageCode" }
        name: { type: string }
        order: { type: integer }
        milestoneCount: { type: integer }
        atRiskCount: { type: integer }
        completedCount: { type: integer }

    PmActivityItem:
      type: object
      required: [id, kind, at, summary]
      properties:
        id: { type: string }
        kind: { type: string, enum: [ChangeEventOpened, ImpactResponded] }
        at: { type: string, format: date-time }
        summary: { type: string }
        milestoneId: { type: ["integer", "null"] }
        milestoneCode: { type: ["string", "null"] }
        changeEventId: { type: ["integer", "null"] }
        companyName: { type: ["string", "null"] }

    PmProjectSummary:
      type: object
      required:
        - projectId
        - projectName
        - projectCode
        - gcCompanyName
        - totalMilestones
        - atRiskMilestoneCount
        - delayedMilestoneCount
        - completedMilestoneCount
        - openChangeEventCount
        - pendingResponseCount
        - overdueResponseCount
        - keyOutputCount
        - stages
        - recentActivity
      properties:
        projectId: { type: integer }
        projectName: { type: string }
        projectCode: { type: string }
        gcCompanyName: { type: string }
        totalMilestones: { type: integer }
        atRiskMilestoneCount: { type: integer }
        delayedMilestoneCount: { type: integer }
        completedMilestoneCount: { type: integer }
        openChangeEventCount: { type: integer }
        pendingResponseCount: { type: integer }
        overdueResponseCount: { type: integer }
        keyOutputCount: { type: integer }
        stages:
          type: array
          items: { $ref: "#/components/schemas/StageBreakdown" }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/PmActivityItem" }

    PmMilestoneCompany:
      type: object
      required: [projectCompanyId, companyId, name, role]
      properties:
        projectCompanyId: { type: integer }
        companyId: { type: integer }
        name: { type: string }
        role: { type: string }

    PmMilestone:
      type: object
      required:
        - id
        - code
        - name
        - stageCode
        - stageName
        - stageOrder
        - status
        - ownerRole
        - currentDate
        - baselineDate
        - isKeyOutput
        - criticalFlag
        - isPaymentTrigger
        - owningCompanies
        - contributorCompanies
        - openChangeEventCount
        - pendingResponseCount
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        stageCode: { $ref: "#/components/schemas/StageCode" }
        stageName: { type: string }
        stageOrder: { type: integer }
        status: { $ref: "#/components/schemas/MilestoneStatus" }
        ownerRole: { type: string }
        currentDate: { type: string, format: date-time }
        baselineDate: { type: string, format: date-time }
        previousDate: { type: ["string", "null"], format: date-time }
        isKeyOutput: { type: boolean }
        criticalFlag: { type: boolean }
        isPaymentTrigger: { type: boolean }
        owningCompanies:
          type: array
          items: { $ref: "#/components/schemas/PmMilestoneCompany" }
        contributorCompanies:
          type: array
          items: { $ref: "#/components/schemas/PmMilestoneCompany" }
        openChangeEventCount: { type: integer }
        pendingResponseCount: { type: integer }

    MilestoneImpactDetail:
      type: object
      required: [id, projectCompanyId, companyName, companyRole, responseStatus, notifiedAt]
      properties:
        id: { type: integer }
        projectCompanyId: { type: integer }
        companyName: { type: string }
        companyRole: { type: string }
        responseStatus: { $ref: "#/components/schemas/ImpactResponseStatus" }
        notifiedAt: { type: string, format: date-time }
        respondedAt: { type: ["string", "null"], format: date-time }
        impactRiskLevel:
          oneOf:
            - { $ref: "#/components/schemas/ImpactRiskLevel" }
            - { type: "null" }
        impactRiskType:
          oneOf:
            - { $ref: "#/components/schemas/ImpactRiskType" }
            - { type: "null" }
        mainRiskIssue: { type: ["string", "null"] }
        detailedComment: { type: ["string", "null"] }

    ChangeEventHistoryItem:
      type: object
      required: [id, initiatedAt, oldDate, proposedNewDate, changeReason, status, impacts]
      properties:
        id: { type: integer }
        initiatedAt: { type: string, format: date-time }
        oldDate: { type: string, format: date-time }
        proposedNewDate: { type: string, format: date-time }
        changeReason: { type: string }
        status: { $ref: "#/components/schemas/ChangeEventStatus" }
        impacts:
          type: array
          items: { $ref: "#/components/schemas/MilestoneImpactDetail" }

    MilestoneDetail:
      type: object
      required:
        - id
        - code
        - name
        - stageCode
        - stageName
        - stageOrder
        - status
        - ownerRole
        - baselineDate
        - currentDate
        - isKeyOutput
        - criticalFlag
        - isPaymentTrigger
        - owningCompanies
        - contributorCompanies
        - changeEvents
        - outstandingCompanies
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        stageCode: { $ref: "#/components/schemas/StageCode" }
        stageName: { type: string }
        stageOrder: { type: integer }
        status: { $ref: "#/components/schemas/MilestoneStatus" }
        ownerRole: { type: string }
        baselineDate: { type: string, format: date-time }
        currentDate: { type: string, format: date-time }
        previousDate: { type: ["string", "null"], format: date-time }
        isKeyOutput: { type: boolean }
        criticalFlag: { type: boolean }
        isPaymentTrigger: { type: boolean }
        changeReasonLatest: { type: ["string", "null"] }
        owningCompanies:
          type: array
          items: { $ref: "#/components/schemas/PmMilestoneCompany" }
        contributorCompanies:
          type: array
          items: { $ref: "#/components/schemas/PmMilestoneCompany" }
        changeEvents:
          type: array
          items: { $ref: "#/components/schemas/ChangeEventHistoryItem" }
        outstandingCompanies:
          type: array
          items: { $ref: "#/components/schemas/PmMilestoneCompany" }

    ProjectCompanyDetail:
      type: object
      required:
        - projectCompanyId
        - companyId
        - name
        - type
        - roleOnProject
        - ownedMilestoneCount
        - contributorMilestoneCount
        - primaryContactName
        - primaryContactEmail
        - totalImpacts
        - pendingImpacts
        - respondedImpacts
        - overdueImpacts
        - responsiveness
      properties:
        projectCompanyId: { type: integer }
        companyId: { type: integer }
        name: { type: string }
        type: { type: string }
        roleOnProject: { type: string }
        ownedMilestoneCount: { type: integer }
        contributorMilestoneCount: { type: integer }
        primaryContactName: { type: string }
        primaryContactEmail: { type: string }
        totalImpacts: { type: integer }
        pendingImpacts: { type: integer }
        respondedImpacts: { type: integer }
        overdueImpacts: { type: integer }
        avgResponseHours: { type: ["number", "null"] }
        responsiveness:
          type: string
          enum: [Responsive, Slow, NonResponding, NoData]

    ChangeEventSummary:
      type: object
      required:
        - id
        - milestoneId
        - milestoneCode
        - milestoneName
        - stageCode
        - stageName
        - initiatedAt
        - oldDate
        - proposedNewDate
        - changeReason
        - status
        - impactedCompanyCount
        - respondedCount
        - pendingCount
        - rollupStatus
      properties:
        id: { type: integer }
        milestoneId: { type: integer }
        milestoneCode: { type: string }
        milestoneName: { type: string }
        stageCode: { $ref: "#/components/schemas/StageCode" }
        stageName: { type: string }
        initiatedAt: { type: string, format: date-time }
        oldDate: { type: string, format: date-time }
        proposedNewDate: { type: string, format: date-time }
        changeReason: { type: string }
        status: { $ref: "#/components/schemas/ChangeEventStatus" }
        impactedCompanyCount: { type: integer }
        respondedCount: { type: integer }
        pendingCount: { type: integer }
        rollupStatus:
          type: string
          enum: [Pending, PartiallyResponded, FullyResponded]

    ChangeEventDetail:
      type: object
      required:
        - id
        - milestoneId
        - milestoneCode
        - milestoneName
        - stageCode
        - stageName
        - initiatedAt
        - oldDate
        - proposedNewDate
        - changeReason
        - status
        - impacts
      properties:
        id: { type: integer }
        milestoneId: { type: integer }
        milestoneCode: { type: string }
        milestoneName: { type: string }
        stageCode: { $ref: "#/components/schemas/StageCode" }
        stageName: { type: string }
        initiatedAt: { type: string, format: date-time }
        oldDate: { type: string, format: date-time }
        proposedNewDate: { type: string, format: date-time }
        changeReason: { type: string }
        status: { $ref: "#/components/schemas/ChangeEventStatus" }
        clientComment: { type: ["string", "null"] }
        clientDecisionAt: { type: ["string", "null"], format: date-time }
        impacts:
          type: array
          items: { $ref: "#/components/schemas/MilestoneImpactDetail" }

    ImpactResponseInput:
      type: object
      required: [impactRiskLevel, impactRiskType, mainRiskIssue]
      properties:
        impactRiskLevel: { $ref: "#/components/schemas/ImpactRiskLevel" }
        impactRiskType: { $ref: "#/components/schemas/ImpactRiskType" }
        mainRiskIssue: { type: string, minLength: 1 }
        detailedComment: { type: string }

    MilestoneImpact:
      type: object
      required:
        - id
        - changeEventId
        - milestoneId
        - projectCompanyId
        - oldDate
        - newDate
        - notifiedAt
        - responseStatus
      properties:
        id: { type: integer }
        changeEventId: { type: integer }
        milestoneId: { type: integer }
        projectCompanyId: { type: integer }
        oldDate: { type: string, format: date-time }
        newDate: { type: string, format: date-time }
        notifiedAt: { type: string, format: date-time }
        respondedAt: { type: ["string", "null"], format: date-time }
        impactRiskLevel: { $ref: "#/components/schemas/ImpactRiskLevel" }
        impactRiskType: { $ref: "#/components/schemas/ImpactRiskType" }
        mainRiskIssue: { type: ["string", "null"] }
        detailedComment: { type: ["string", "null"] }
        responseStatus: { $ref: "#/components/schemas/ImpactResponseStatus" }
        pmResolutionNote: { type: ["string", "null"] }

    CompanyMembership:
      type: object
      required: [companyId, companyName, role]
      properties:
        companyId: { type: integer }
        companyName: { type: string }
        role: { type: string }

    Workspace:
      type: object
      required: [companyId, companyName, projectId, projectName, projectCode]
      properties:
        companyId: { type: integer }
        companyName: { type: string }
        projectId: { type: integer }
        projectName: { type: string }
        projectCode: { type: string }

    SetActiveWorkspaceInput:
      type: object
      required: [companyId, projectId]
      properties:
        companyId: { type: integer }
        projectId: { type: integer }

    Me:
      type: object
      required: [userId, clerkUserId, companies, workspaces]
      properties:
        userId: { type: integer }
        clerkUserId: { type: string }
        email: { type: ["string", "null"] }
        companies:
          type: array
          items: { $ref: "#/components/schemas/CompanyMembership" }
        workspaces:
          type: array
          items: { $ref: "#/components/schemas/Workspace" }
        activeProjectId: { type: ["integer", "null"] }
        activeProjectName: { type: ["string", "null"] }
        activeProjectCode: { type: ["string", "null"] }
        activeCompanyId: { type: ["integer", "null"] }
        activeCompanyName: { type: ["string", "null"] }
