openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: milestones
    description: Milestone operations
  - name: impacts
    description: Impact response operations
  - name: projects
    description: Project metadata
  - name: me
    description: Current user
  - name: admin
    description: Company admin operations
  - name: client
    description: Client-side review of change events
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Current user, their companies, and active project
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/active-workspace:
    post:
      operationId: setActiveWorkspace
      tags: [me]
      summary: Set the signed-in user's active (company, project) workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveWorkspaceInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Invalid workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/summary:
    get:
      operationId: getMyProjectSummary
      tags: [projects]
      summary: Project summary for the signed-in user's active project
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No accessible project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/milestones/upcoming:
    get:
      operationId: getMyUpcomingMilestones
      tags: [milestones]
      summary: Upcoming milestones for the signed-in user's company on the active project
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingMilestone"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/impacts/pending:
    get:
      operationId: getMyPendingImpacts
      tags: [impacts]
      summary: Pending impacts for the signed-in user's company on the active project
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingImpact"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/portfolio:
    get:
      operationId: getClientPortfolio
      tags: [client]
      summary: Portfolio of projects the signed-in client can see, with per-company entry/exit dates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClientPortfolioProject" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /me/client-reviews:
    get:
      operationId: listClientReviews
      tags: [client]
      summary: Change events awaiting the signed-in user's client-side decision
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClientReviewItem" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /me/client-reviews/{changeEventId}:
    get:
      operationId: getClientReviewDetail
      tags: [client]
      summary: Detail of a change event the signed-in user can decide on as a client
      parameters:
        - in: path
          name: changeEventId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeEventDetail" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /me/client-reviews/{changeEventId}/decision:
    post:
      operationId: submitClientDecision
      tags: [client]
      summary: Record the client's approve/reject decision on a change event
      parameters:
        - in: path
          name: changeEventId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientDecisionInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeEventDetail" }
        "400":
          description: Invalid input or transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectListItem" }

  /projects/{projectId}/pm-summary:
    get:
      operationId: getPmProjectSummary
      tags: [projects]
      summary: PM project dashboard summary
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PmProjectSummary" }

  /projects/{projectId}/milestones:
    get:
      operationId: getProjectMilestones
      tags: [milestones]
      summary: Master schedule – all milestones for a project
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PmMilestone" }

  /milestones/{milestoneId}/detail:
    get:
      operationId: getMilestoneDetail
      tags: [milestones]
      summary: Full milestone detail (PM view) with change history and responses
      parameters:
        - in: path
          name: milestoneId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MilestoneDetail" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /projects/{projectId}/milestones-create:
    post:
      operationId: createMilestone
      tags: [milestones]
      summary: PM creates a new milestone (allowed only while schedule is Draft)
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMilestoneInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MilestoneDetail" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden or schedule no longer Draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /milestones/{milestoneId}:
    patch:
      operationId: updateMilestone
      tags: [milestones]
      summary: PM edits a milestone directly (allowed only while schedule is Draft)
      parameters:
        - in: path
          name: milestoneId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMilestoneInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MilestoneDetail" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Schedule is no longer Draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteMilestone
      tags: [milestones]
      summary: PM deletes a milestone (allowed only while schedule is Draft)
      parameters:
        - in: path
          name: milestoneId
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed
        "403":
          description: Schedule is no longer Draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /projects/{projectId}/schedule/submit-baseline:
    post:
      operationId: submitScheduleBaseline
      tags: [baselines]
      summary: PM submits the current schedule for client baseline approval
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitBaselineInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleBaseline" }
        "400":
          description: Invalid state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /projects/{projectId}/schedule/baseline:
    get:
      operationId: getProjectScheduleBaseline
      tags: [baselines]
      summary: Latest baseline (any status) for the project, if any
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK or null
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ScheduleBaseline" }
                  - { type: "null" }

  /me/baseline-reviews:
    get:
      operationId: listBaselineReviews
      tags: [baselines]
      summary: Pending baseline submissions awaiting the client's decision
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BaselineReviewItem" }

  /me/baseline-reviews/{baselineId}:
    get:
      operationId: getBaselineReviewDetail
      tags: [baselines]
      summary: Detail of a pending baseline for client review
      parameters:
        - in: path
          name: baselineId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleBaseline" }

  /me/baseline-reviews/{baselineId}/decision:
    post:
      operationId: submitBaselineDecision
      tags: [baselines]
      summary: Client approves or rejects a baseline submission
      parameters:
        - in: path
          name: baselineId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BaselineDecisionInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleBaseline" }

  /projects/{projectId}/schedule/baseline/{baselineId}/acknowledge:
    post:
      operationId: acknowledgeBaselineDecision
      tags: [baselines]
      summary: PM acknowledges the client's decision on a baseline so the inbox banner is dismissed
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer }
        - in: path
          name: baselineId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleBaseline" }
        "400":
          description: Baseline is still pending or already acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /milestones/{milestoneId}/edit-requests:
    post:
      operationId: createMilestoneEditRequest
      tags: [impacts]
      summary: PM opens a non-date edit request on a baselined milestone
      parameters:
        - in: path
          name: milestoneId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMilestoneEditRequestInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeEventDetail" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /projects/{projectId}/companies:
    get:
      operationId: getProjectCompanies
      tags: [projects]
      summary: Companies participating in a project, with responsiveness rollups
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectCompanyDetail" }

  /projects/{projectId}/change-events:
    get:
      operationId: getProjectChangeEvents
      tags: [impacts]
      summary: Chronological list of all change events on a project
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChangeEventSummary" }

  /milestones/{milestoneId}/change-events:
    post:
      operationId: createChangeEvent
      tags: [impacts]
      summary: PM creates a new change event proposing a new date for a milestone
      parameters:
        - in: path
          name: milestoneId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChangeEventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeEventDetail" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Milestone not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /change-events/{changeEventId}/resend-notifications:
    post:
      operationId: resendChangeEventNotifications
      tags: [impacts]
      summary: Re-send change event notifications to impacted companies (e.g. non-responders)
      parameters:
        - in: path
          name: changeEventId
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendNotificationsInput"
      responses:
        "200":
          description: Delivery results per impact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendNotificationsResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Change event not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /change-events/{changeEventId}/detail:
    get:
      operationId: getChangeEventDetail
      tags: [impacts]
      summary: Drill-in detail for a change event including all per-company responses
      parameters:
        - in: path
          name: changeEventId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeEventDetail" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /change-events/{changeEventId}:
    patch:
      operationId: editChangeEvent
      tags: [impacts]
      summary: PM edits a change event (only allowed while no responses have come in)
      parameters:
        - in: path
          name: changeEventId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditChangeEventInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeEventDetail" }
        "400":
          description: Invalid request or event is no longer editable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Change event not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /change-events/{changeEventId}/transition:
    post:
      operationId: transitionChangeEvent
      tags: [impacts]
      summary: Move a change event through its lifecycle (send / approve / reject / cancel)
      parameters:
        - in: path
          name: changeEventId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionChangeEventInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangeEventDetail" }
        "400":
          description: Invalid transition or input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Change event not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/projects:
    get:
      operationId: adminListProjects
      tags: [admin]
      summary: List projects accessible to the admin's company
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminProjectListItem" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/projects/{projectId}:
    get:
      operationId: adminGetProjectDetail
      tags: [admin]
      summary: Full admin view of a project (assignments + contractors + available users)
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProjectDetail" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/projects/{projectId}/assignments:
    post:
      operationId: adminUpsertProjectAssignment
      tags: [admin]
      summary: Create or update a user's role on a project
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUpsertAssignmentInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProjectAssignment" }
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/projects/{projectId}/assignments/{assignmentId}:
    delete:
      operationId: adminRemoveProjectAssignment
      tags: [admin]
      summary: Remove a project assignment
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer }
        - in: path
          name: assignmentId
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/project-company-roles:
    get:
      operationId: adminListProjectCompanyRoles
      tags: [admin]
      summary: List built-in and custom project-company roles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectCompanyRole" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: adminCreateProjectCompanyRole
      tags: [admin]
      summary: Create a new custom project-company role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreateProjectCompanyRoleInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCompanyRole" }
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/project-company-roles/{id}:
    patch:
      operationId: adminRenameProjectCompanyRole
      tags: [admin]
      summary: Rename a custom project-company role (built-in roles cannot be renamed)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRenameProjectCompanyRoleInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectCompanyRole" }
        "400":
          description: Invalid input (built-in, duplicate label, empty)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: adminDeleteProjectCompanyRole
      tags: [admin]
      summary: Delete a custom project-company role (not allowed for built-in or in-use roles)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed
        "400":
          description: Cannot delete (built-in or in use)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /pm/stages:
    get:
      operationId: listStages
      tags: [pm]
      summary: List global project stages (built-in + custom), ordered by display order
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectStage" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: createStage
      tags: [pm]
      summary: Add a new custom global stage. Requires PM access on at least one project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStageInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectStage" }
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /pm/stages/reorder:
    post:
      operationId: reorderStages
      tags: [pm]
      summary: Update display order for stages (provide all stage IDs in desired order)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReorderStagesInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectStage" }
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /pm/stages/{id}:
    patch:
      operationId: renameStage
      tags: [pm]
      summary: Rename a stage. Built-in stages can be renamed but not deleted.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameStageInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectStage" }
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: deleteStage
      tags: [pm]
      summary: Delete a stage. Not allowed for built-in stages or stages with milestones.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed
        "400":
          description: Cannot delete (built-in or in use)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/projects/{projectId}/contractors:
    post:
      operationId: adminAddContractorCompany
      tags: [admin]
      summary: Add a contractor company to a project
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAddContractorInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProjectContractorCompany" }
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/projects/{projectId}/contractors/{projectCompanyId}:
    delete:
      operationId: adminRemoveContractorCompany
      tags: [admin]
      summary: Remove a contractor company from a project
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: integer }
        - in: path
          name: projectCompanyId
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /impacts/{impactId}/respond:
    post:
      operationId: respondToImpact
      tags: [impacts]
      summary: Submit a response to an impact notification
      parameters:
        - in: path
          name: impactId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpactResponseInput"
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneImpact"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]

    ProjectStage:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        label: { type: string }
        displayOrder: { type: integer }
        isBuiltIn: { type: boolean }
        milestoneCount: { type: integer }
      required: [id, code, label, displayOrder, isBuiltIn, milestoneCount]

    CreateStageInput:
      type: object
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
      required: [label]

    RenameStageInput:
      type: object
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
      required: [label]

    ReorderStagesInput:
      type: object
      properties:
        stageIds:
          type: array
          items: { type: integer }
      required: [stageIds]

    StageCode:
      type: string
      description: >
        Stable identifier for a project stage. Refers to
        `ProjectStage.code`. Stages are now editable, so this is a
        free-form string (the original 10 codes such as
        `ST1_PRE_DESIGN_CONCEPT` are seeded as built-in stages).

    MilestoneStatus:
      type: string
      enum: [Planned, OnTrack, AtRisk, Delayed, Completed]

    ImpactRiskLevel:
      type: string
      enum: [None, Low, Medium, High]

    ImpactRiskType:
      type: string
      enum: [Time, Cost, Quality, Scope, Resources, Authority, Other]

    ImpactResponseStatus:
      type: string
      enum: [Pending, Submitted, Reviewed, Closed]

    ChangeEventStatus:
      type: string
      enum:
        - Draft
        - SentForClientReview
        - ClientApproved
        - ClientRejected
        - PMApproved
        - Cancelled

    ChangeEventEditKind:
      type: string
      enum: [DateChange, FieldEdit]

    ProjectScheduleStatus:
      type: string
      enum: [Draft, PendingBaseline, Baselined]

    ScheduleBaselineStatus:
      type: string
      enum: [Pending, Approved, Rejected]

    MilestoneProposedChanges:
      type: object
      description: Diff of milestone field edits proposed in a change event (FieldEdit kind).
      properties:
        name: { type: string }
        description: { type: ["string", "null"] }
        code: { type: string }
        ownerRole: { type: string }
        criticalFlag: { type: boolean }
        isKeyOutput: { type: boolean }
        isPaymentTrigger: { type: boolean }
        ownerProjectCompanyIds:
          type: array
          items: { type: integer }
        contributorProjectCompanyIds:
          type: array
          items: { type: integer }
        predecessorIds:
          type: array
          items: { type: integer }

    CreateMilestoneInput:
      type: object
      required: [stageCode, code, name, ownerRole, baselineDate]
      properties:
        stageCode: { $ref: "#/components/schemas/StageCode" }
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        description: { type: string }
        ownerRole: { type: string, minLength: 1 }
        baselineDate: { type: string, format: date-time }
        criticalFlag: { type: boolean }
        isKeyOutput: { type: boolean }
        isPaymentTrigger: { type: boolean }
        ownerProjectCompanyIds:
          type: array
          items: { type: integer }
        contributorProjectCompanyIds:
          type: array
          items: { type: integer }
        predecessorIds:
          type: array
          items: { type: integer }

    UpdateMilestoneInput:
      type: object
      description: Direct edit, allowed only while schedule is Draft. All fields optional.
      properties:
        stageCode: { $ref: "#/components/schemas/StageCode" }
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        ownerRole: { type: string, minLength: 1 }
        baselineDate: { type: string, format: date-time }
        criticalFlag: { type: boolean }
        isKeyOutput: { type: boolean }
        isPaymentTrigger: { type: boolean }
        ownerProjectCompanyIds:
          type: array
          items: { type: integer }
        contributorProjectCompanyIds:
          type: array
          items: { type: integer }
        predecessorIds:
          type: array
          items: { type: integer }

    CreateMilestoneEditRequestInput:
      type: object
      required: [proposedChanges, changeReason]
      properties:
        proposedChanges: { $ref: "#/components/schemas/MilestoneProposedChanges" }
        changeReason: { type: string, minLength: 1 }
        impactedProjectCompanyIds:
          type: array
          items: { type: integer }
          description: Optional contractor companies to notify. Empty means skip contractor assessment.

    SubmitBaselineInput:
      type: object
      properties:
        note: { type: string }

    BaselineDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        comment: { type: string }

    BaselineMilestoneSnapshot:
      type: object
      required: [milestoneId, code, name, stageCode, baselineDate, ownerRole]
      properties:
        milestoneId: { type: integer }
        code: { type: string }
        name: { type: string }
        stageCode: { $ref: "#/components/schemas/StageCode" }
        stageName: { type: string }
        ownerRole: { type: string }
        baselineDate: { type: string, format: date-time }
        currentDate: { type: string, format: date-time }
        isKeyOutput: { type: boolean }
        criticalFlag: { type: boolean }
        isPaymentTrigger: { type: boolean }
        predecessorIds:
          type: array
          items: { type: integer }

    ScheduleBaseline:
      type: object
      required: [id, projectId, status, submittedAt, milestones]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        projectName: { type: string }
        projectCode: { type: string }
        status: { $ref: "#/components/schemas/ScheduleBaselineStatus" }
        submittedAt: { type: string, format: date-time }
        submittedByUserId: { type: ["integer", "null"] }
        submittedByEmail: { type: ["string", "null"] }
        submissionNote: { type: ["string", "null"] }
        decidedAt: { type: ["string", "null"], format: date-time }
        decidedByUserId: { type: ["integer", "null"] }
        decidedByEmail: { type: ["string", "null"] }
        decisionComment: { type: ["string", "null"] }
        pmAcknowledgedAt: { type: ["string", "null"], format: date-time }
        pmAcknowledgedByUserId: { type: ["integer", "null"] }
        milestoneCount: { type: integer }
        milestones:
          type: array
          items: { $ref: "#/components/schemas/BaselineMilestoneSnapshot" }

    BaselineDecisionSummary:
      type: object
      description: Summary of the most recent decided (Approved or Rejected) baseline on a project, used to surface the client's decision to the PM in-app.
      required: [id, projectId, status, submittedAt, decidedAt, milestoneCount, acknowledged]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        status: { $ref: "#/components/schemas/ScheduleBaselineStatus" }
        submittedAt: { type: string, format: date-time }
        submittedByEmail: { type: ["string", "null"] }
        submissionNote: { type: ["string", "null"] }
        decidedAt: { type: string, format: date-time }
        decidedByUserId: { type: ["integer", "null"] }
        decidedByEmail: { type: ["string", "null"] }
        decisionComment: { type: ["string", "null"] }
        milestoneCount: { type: integer }
        acknowledged: { type: boolean }
        pmAcknowledgedAt: { type: ["string", "null"], format: date-time }

    BaselineReviewItem:
      type: object
      required: [id, projectId, projectName, projectCode, status, submittedAt, milestoneCount]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        projectName: { type: string }
        projectCode: { type: string }
        status: { $ref: "#/components/schemas/ScheduleBaselineStatus" }
        submittedAt: { type: string, format: date-time }
        submittedByEmail: { type: ["string", "null"] }
        submissionNote: { type: ["string", "null"] }
        milestoneCount: { type: integer }

    StageInfo:
      type: object
      required: [stageCode, name, order, milestoneCount, keyOutputCount, companyMilestoneCount]
      properties:
        stageCode: { $ref: "#/components/schemas/StageCode" }
        name: { type: string }
        order: { type: integer }
        milestoneCount: { type: integer }
        keyOutputCount: { type: integer }
        companyMilestoneCount: { type: integer }

    ProjectSummary:
      type: object
      required: [projectId, projectName, projectCode, stages, upcomingMilestoneCount, pendingImpactCount]
      properties:
        projectId: { type: integer }
        projectName: { type: string }
        projectCode: { type: string }
        stages:
          type: array
          items: { $ref: "#/components/schemas/StageInfo" }
        upcomingMilestoneCount: { type: integer }
        pendingImpactCount: { type: integer }

    UpcomingMilestone:
      type: object
      required:
        - id
        - code
        - name
        - stageCode
        - stageName
        - currentDate
        - status
        - isKeyOutput
        - criticalFlag
        - ownerRole
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        stageCode: { $ref: "#/components/schemas/StageCode" }
        stageName: { type: string }
        currentDate: { type: string, format: date-time }
        baselineDate: { type: string, format: date-time }
        previousDate: { type: ["string", "null"], format: date-time }
        status: { $ref: "#/components/schemas/MilestoneStatus" }
        isKeyOutput: { type: boolean }
        criticalFlag: { type: boolean }
        ownerRole: { type: string }

    PendingImpact:
      type: object
      required:
        - id
        - milestoneId
        - milestoneName
        - milestoneCode
        - stageCode
        - stageName
        - oldDate
        - newDate
        - changeReason
        - changeEventStatus
        - notifiedAt
        - responseStatus
      properties:
        id: { type: integer }
        milestoneId: { type: integer }
        milestoneName: { type: string }
        milestoneCode: { type: string }
        stageCode: { $ref: "#/components/schemas/StageCode" }
        stageName: { type: string }
        oldDate: { type: string, format: date-time }
        newDate: { type: string, format: date-time }
        changeReason: { type: string }
        changeEventStatus: { $ref: "#/components/schemas/ChangeEventStatus" }
        notifiedAt: { type: string, format: date-time }
        responseStatus: { $ref: "#/components/schemas/ImpactResponseStatus" }
        isKeyOutput: { type: boolean }

    ProjectListItem:
      type: object
      required: [id, name, code, companyCount, milestoneCount]
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        companyCount: { type: integer }
        milestoneCount: { type: integer }

    StageBreakdown:
      type: object
      required: [stageCode, name, order, milestoneCount, atRiskCount, completedCount]
      properties:
        stageCode: { $ref: "#/components/schemas/StageCode" }
        name: { type: string }
        order: { type: integer }
        milestoneCount: { type: integer }
        atRiskCount: { type: integer }
        completedCount: { type: integer }

    PmActivityItem:
      type: object
      required: [id, kind, at, summary]
      properties:
        id: { type: string }
        kind: { type: string, enum: [ChangeEventOpened, ImpactResponded] }
        at: { type: string, format: date-time }
        summary: { type: string }
        milestoneId: { type: ["integer", "null"] }
        milestoneCode: { type: ["string", "null"] }
        changeEventId: { type: ["integer", "null"] }
        companyName: { type: ["string", "null"] }

    PmProjectSummary:
      type: object
      required:
        - projectId
        - projectName
        - projectCode
        - gcCompanyName
        - scheduleStatus
        - totalMilestones
        - atRiskMilestoneCount
        - delayedMilestoneCount
        - completedMilestoneCount
        - openChangeEventCount
        - pendingResponseCount
        - overdueResponseCount
        - keyOutputCount
        - stages
        - recentActivity
      properties:
        projectId: { type: integer }
        projectName: { type: string }
        projectCode: { type: string }
        gcCompanyName: { type: string }
        scheduleStatus: { $ref: "#/components/schemas/ProjectScheduleStatus" }
        baselinedAt: { type: ["string", "null"], format: date-time }
        pendingBaselineId: { type: ["integer", "null"] }
        totalMilestones: { type: integer }
        atRiskMilestoneCount: { type: integer }
        delayedMilestoneCount: { type: integer }
        completedMilestoneCount: { type: integer }
        openChangeEventCount: { type: integer }
        pendingResponseCount: { type: integer }
        overdueResponseCount: { type: integer }
        keyOutputCount: { type: integer }
        stages:
          type: array
          items: { $ref: "#/components/schemas/StageBreakdown" }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/PmActivityItem" }
        latestDecidedBaseline:
          oneOf:
            - { $ref: "#/components/schemas/BaselineDecisionSummary" }
            - { type: "null" }

    PmMilestoneCompany:
      type: object
      required: [projectCompanyId, companyId, name, role]
      properties:
        projectCompanyId: { type: integer }
        companyId: { type: integer }
        name: { type: string }
        role: { type: string }

    PmMilestone:
      type: object
      required:
        - id
        - code
        - name
        - stageCode
        - stageName
        - stageOrder
        - status
        - ownerRole
        - currentDate
        - baselineDate
        - isKeyOutput
        - criticalFlag
        - isPaymentTrigger
        - owningCompanies
        - contributorCompanies
        - openChangeEventCount
        - pendingResponseCount
        - scheduleStatus
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        stageCode: { $ref: "#/components/schemas/StageCode" }
        stageName: { type: string }
        stageOrder: { type: integer }
        status: { $ref: "#/components/schemas/MilestoneStatus" }
        ownerRole: { type: string }
        currentDate: { type: string, format: date-time }
        baselineDate: { type: string, format: date-time }
        previousDate: { type: ["string", "null"], format: date-time }
        isKeyOutput: { type: boolean }
        criticalFlag: { type: boolean }
        isPaymentTrigger: { type: boolean }
        owningCompanies:
          type: array
          items: { $ref: "#/components/schemas/PmMilestoneCompany" }
        contributorCompanies:
          type: array
          items: { $ref: "#/components/schemas/PmMilestoneCompany" }
        predecessorIds:
          type: array
          items: { type: integer }
        openChangeEventCount: { type: integer }
        pendingResponseCount: { type: integer }
        scheduleStatus: { $ref: "#/components/schemas/ProjectScheduleStatus" }

    MilestoneImpactDetail:
      type: object
      required: [id, projectCompanyId, companyName, companyRole, responseStatus, notifiedAt]
      properties:
        id: { type: integer }
        projectCompanyId: { type: integer }
        companyName: { type: string }
        companyRole: { type: string }
        responseStatus: { $ref: "#/components/schemas/ImpactResponseStatus" }
        notifiedAt: { type: string, format: date-time }
        respondedAt: { type: ["string", "null"], format: date-time }
        impactRiskLevel:
          oneOf:
            - { $ref: "#/components/schemas/ImpactRiskLevel" }
            - { type: "null" }
        impactRiskType:
          oneOf:
            - { $ref: "#/components/schemas/ImpactRiskType" }
            - { type: "null" }
        mainRiskIssue: { type: ["string", "null"] }
        detailedComment: { type: ["string", "null"] }
        lastDeliveryStatus:
          oneOf:
            - { type: string, enum: [Sent, Failed] }
            - { type: "null" }
        lastDeliveryChannel:
          oneOf:
            - { type: string, enum: [email, log] }
            - { type: "null" }
        lastDeliveryAt: { type: ["string", "null"], format: date-time }
        lastDeliveryError: { type: ["string", "null"] }
        deliveryAttemptCount: { type: integer }
        recipientEmail: { type: ["string", "null"] }

    ChangeEventHistoryItem:
      type: object
      required: [id, editKind, initiatedAt, changeReason, status, impacts]
      properties:
        id: { type: integer }
        editKind: { $ref: "#/components/schemas/ChangeEventEditKind" }
        initiatedAt: { type: string, format: date-time }
        oldDate: { type: ["string", "null"], format: date-time }
        proposedNewDate: { type: ["string", "null"], format: date-time }
        proposedChanges:
          oneOf:
            - { $ref: "#/components/schemas/MilestoneProposedChanges" }
            - { type: "null" }
        changeReason: { type: string }
        status: { $ref: "#/components/schemas/ChangeEventStatus" }
        impacts:
          type: array
          items: { $ref: "#/components/schemas/MilestoneImpactDetail" }

    MilestoneDetail:
      type: object
      required:
        - id
        - code
        - name
        - stageCode
        - stageName
        - stageOrder
        - status
        - ownerRole
        - baselineDate
        - currentDate
        - isKeyOutput
        - criticalFlag
        - isPaymentTrigger
        - owningCompanies
        - contributorCompanies
        - changeEvents
        - outstandingCompanies
        - scheduleStatus
        - projectId
        - predecessorIds
      properties:
        predecessorIds:
          type: array
          items: { type: integer }
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        stageCode: { $ref: "#/components/schemas/StageCode" }
        stageName: { type: string }
        stageOrder: { type: integer }
        status: { $ref: "#/components/schemas/MilestoneStatus" }
        ownerRole: { type: string }
